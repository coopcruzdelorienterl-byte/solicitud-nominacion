plugins {
    id "com.android.application"
}

android {
    namespace "bo.cruzdeloriente.nominacion"
    compileSdk 35

    defaultConfig {
        applicationId "bo.cruzdeloriente.nominacion"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
