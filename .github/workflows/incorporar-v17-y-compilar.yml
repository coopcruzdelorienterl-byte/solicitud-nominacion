name: Incorporar V17 y compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer V17 y sustituir archivos antiguos
        run: |
          ARCHIVE="CruzDelOriente_Android_APK_Project_V17.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/v17
          unzip -q "$ARCHIVE" -d /tmp/v17
          PROJECT_DIR="$(find /tmp/v17 -mindepth 1 -maxdepth 2 -type d -name 'CruzDelOriente_Android_APK_Project' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          rm -f "$ARCHIVE" index.html logo-cooperativa.jpg manifest.webmanifest sw.js README.md
          rm -rf .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Replace legacy web prototype with approved Android V17 project"
            git push
          fi

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Solicitud-Nominacion-Cruz-del-Oriente-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
